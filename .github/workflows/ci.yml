name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install --legacy-peer-deps
      - name: Build web
        run: npm run build --workspace=@forgeledger/web
      - name: Build api
        run: npm run build --workspace=@forgeledger/api
      - name: Unit tests
        run: npm test --workspace=@forgeledger/api
      - name: API smoke
        run: |
          mkdir -p data
          cd apps/api
          PORT=8080 HOST=127.0.0.1 SQLITE_PATH=../../data/ci.sqlite node dist/main.js &
          sleep 5
          curl -sf http://127.0.0.1:8080/api/health
          curl -sf -X POST http://127.0.0.1:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"demo@forgeledger.app","password":"demo1234"}' | grep accessToken
