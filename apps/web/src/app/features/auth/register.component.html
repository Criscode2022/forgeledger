<div class="grid min-h-screen place-items-center px-4 py-10">
  <div class="w-full max-w-md">
    <div class="mb-8 text-center">
      <div class="mx-auto mb-4 flex h-11 w-11 items-center justify-center rounded-sm bg-accent text-accent-fg font-semibold">F</div>
      <h1 class="font-display text-2xl font-semibold tracking-tight">Create your workspace</h1>
      <p class="mt-2 text-sm text-muted">Start tracking clients, invoices, and expenses in minutes.</p>
    </div>

    <form class="card space-y-4" (ngSubmit)="submit()" [formGroup]="form">
      <div>
        <label class="label" for="name">Your name</label>
        <input id="name" class="input" type="text" formControlName="name" />
      </div>
      <div>
        <label class="label" for="businessName">Business name</label>
        <input id="businessName" class="input" type="text" formControlName="businessName" placeholder="Optional" />
      </div>
      <div>
        <label class="label" for="email">Email</label>
        <input id="email" class="input" type="email" formControlName="email" autocomplete="email" />
      </div>
      <div>
        <label class="label" for="password">Password</label>
        <input id="password" class="input" type="password" formControlName="password" autocomplete="new-password" />
        <p class="mt-1 text-xs text-subtle">At least 8 characters</p>
      </div>

      @if (error()) {
        <p class="rounded-sm bg-elevated text-danger px-3 py-2 text-sm text-danger">{{ error() }}</p>
      }

      <button class="btn-primary w-full" type="submit" [disabled]="loading()">
        {{ loading() ? 'Creating…' : 'Create account' }}
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-muted">
      Already have an account?
      <a routerLink="/login" class="text-fg underline-offset-4 hover:underline">Sign in</a>
    </p>
  </div>
</div>
