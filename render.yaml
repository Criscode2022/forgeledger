services:
  - type: web
    name: forgeledger
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8080
      - key: HOST
        value: 0.0.0.0
      # Set DATABASE_URL to your Neon connection string in the Render dashboard
